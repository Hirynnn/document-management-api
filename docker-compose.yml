version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: document-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: document_management_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-management-api
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/document_management_api?schema=public
      JWT_SECRET: super_secret_document_api_2026
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 5242880
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads

volumes:
  postgres_data:
